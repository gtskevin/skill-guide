name: Bug Report
description: Report a problem with skill-guide
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please include the scanner output if possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: e.g. `npx skill-guide --open`, `node scan-skills.js --list`
      render: bash
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output or error message
      render: text
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`
      placeholder: e.g. v20.11.0
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 14.5, Ubuntu 22.04
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run `npx skill-guide --doctor` and paste the result
      render: text
